<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: #fff8f6;
  color: #444;
}

/* HERO */
.hero {
  height: 100vh;
  background: linear-gradient(rgba(255,240,245,0.7), rgba(255,240,245,0.7)),
              url('https://images.unsplash.com/photo-1520857014576-2c4f4c972b57');
  background-size: cover;
  background-position: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* اللوجو صغير جدًا (اختياري) */
.logo {
  width: 80px;
  opacity: 0.7;
  margin-bottom: 10px;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  color: #ff8fab;
  margin: 0;
}

.hero p {
  font-size: 18px;
  margin-top: 10px;
}

/* SECTIONS */
.section {
  padding: 50px 20px;
  text-align: center;
}

.card {
  max-width: 420px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  margin-top: 20px;
}

/* MAP */
iframe {
  width: 100%;
  height: 250px;
  border: none;
  border-radius: 15px;
}

/* FORM */
input, select {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  padding: 10px 20px;
  border: none;
  background: #ff8fab;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #ff4f81;
}
</style>

</head>

<body>

<!-- HERO -->
<div class="hero">

  <!-- احذفيه خالص لو مش عايزة لوجو -->
  <!-- <img src="logo.png" class="logo"> -->

  <h1>Blush Moments</h1>
  <p>We invite you to celebrate our wedding 💍</p>

</div>

<!-- DETAILS -->
<div class="section">
  <h2>Wedding Details</h2>

  <div class="card">
    <p><b>Hall:</b> Royal Garden</p>
    <p><b>Location:</b> Nasr City, Cairo</p>
    <p><b>Date:</b> 25 April - 7 PM</p>
  </div>
</div>

<!-- MAP -->
<div class="section">
  <h2>Location 📍</h2>

  <div class="card">
    <iframe src="https://maps.google.com/maps?q=cairo&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
  </div>
</div>

<!-- RSVP -->
<div class="section">
  <h2>RSVP 💌</h2>

  <div class="card">

    <form action="https://formspree.io/f/yourID" method="POST">

      <input type="text" name="name" placeholder="Your Name" required>

      <input type="email" name="email" placeholder="Your Email" required>

      <select name="attendance">
        <option value="yes">Attending ✅</option>
        <option value="no">Not Attending ❌</option>
      </select>

      <button type="submit">Send</button>

    </form>

  </div>
</div>

</body>
</html>
