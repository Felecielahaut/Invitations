<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  background: linear-gradient(135deg, #fff8f6, #fadadd);
  text-align: center;
}

.container {
  padding: 40px 20px;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 50px;
  color: #ff8fab;
}

.card {
  background: white;
  margin: 20px auto;
  padding: 25px;
  max-width: 400px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  animation: fadeIn 1s ease;
}

button {
  padding: 10px 20px;
  border: none;
  background: #ff8fab;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #ff4f81;
}

input, select {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

iframe {
  width: 100%;
  height: 250px;
  border-radius: 15px;
  border: none;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<h1>Blush Moments 💖</h1>
<p>You’re invited to our special day ✨</p>

<!-- Event Info -->
<div class="card">
  <h3>Wedding Details 💍</h3>
  <p><b>Hall:</b> Royal Garden</p>
  <p><b>Location:</b> Nasr City, Cairo</p>
  <p><b>Date:</b> 25 April - 7 PM</p>
</div>

<!-- Google Map -->
<div class="card">
  <h3>Location 📍</h3>

  <!-- غيري اللينك ده من جوجل مابس -->
  <iframe src="https://maps.google.com/maps?q=cairo&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>

</div>

<!-- RSVP -->
<div class="card">
  <h3>RSVP 💌</h3>

  <!-- حطي لينك Formspree هنا -->
  <form action="https://formspree.io/f/yourID" method="POST">

    <input type="text" name="name" placeholder="Your Name" required>

    <input type="email" name="email" placeholder="Your Email" required>

    <select name="attendance">
      <option value="yes">Attending ✅</option>
      <option value="no">Not Attending ❌</option>
    </select>

    <button type="submit">Send</button>

  </form>
</div>

</div>

</body>
</html>
