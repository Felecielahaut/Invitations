
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>You're Invited 💌</title>

<style>
body {
  margin: 0;
  font-family: 'Arial';
  background: linear-gradient(135deg, #ffd6e7, #e0c3fc);
  text-align: center;
  overflow: hidden;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 300px;
  margin: 120px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  animation: pop 1s ease;
}

h1 {
  color: #ff4f81;
}

button {
  margin-top: 15px;
  padding: 12px 20px;
  border: none;
  background: #ff8fab;
  color: white;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #ff4f81;
}

@keyframes pop {
  from {transform: scale(0.5); opacity: 0;}
  to {transform: scale(1); opacity: 1;}
}

/* قلوب متحركة */
.heart {
  position: absolute;
  color: pink;
  animation: float 5s linear infinite;
}

@keyframes float {
  from {transform: translateY(100vh);}
  to {transform: translateY(-10vh);}
}
</style>

</head>

<body>

<div class="card">
  <h1>You're Invited 🎉</h1>
  <p>Birthday Party 💖</p>
  <p>April 25 - 7 PM</p>

  <button onclick="rsvp()">RSVP</button>
</div>

<script>
function rsvp() {
  alert("Yay! Can't wait to see you 💕");
}

/* قلوب عشوائية */
for(let i=0;i<15;i++){
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.fontSize = (20 + Math.random()*20) + "px";
  heart.style.animationDuration = (3 + Math.random()*3) + "s";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
